<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개념기반 탐구 칠판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Dodum&family=Jua&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
/* 레이아웃: 실제 교실 칠판 배치(렌즈·날짜 / 탐구질문 / 개념은행·탐구활동 / 일반화문장)를 화면 비율에 맞춰 그대로 옮긴 한 화면 보드 */
:root {
  /* 흰 보드 (기본) */
  --board: #fbfbf7;
  --frame: #d9d4c7;
  --ink: #1d201e;
  --ink-soft: #8a8f8b;
  --ink-red: #d1253c;
  --ink-blue: #2350b0;
  --tag-bg: #1b1d1c;
  --tag-fg: #ffffff;
  --tag-num: #ffd23f;
  --lens-ring: #1b1d1c;
  --hl-yellow: rgba(255, 214, 10, .45);
  --ui-bg: rgba(255, 255, 255, .94);
  --ui-fg: #1d201e;
  --ui-line: #d7d9d4;
  --ui-hover: #eef0ea;
  --focus: #2350b0;

  --font-label: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-board: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  --u: min(1vw, 1.7778vh);
  --scale: 1;
  --fit: 1; /* 내용이 16:9 화면을 넘칠 때 자동으로 줄어드는 비율 */
  --t-body: calc(var(--u) * 2.9 * var(--scale) * var(--fit));
  --t-chip: calc(var(--u) * 2.6 * var(--scale) * var(--fit));
  --t-tag: calc(var(--u) * 1.85 * (.4 + .6 * var(--fit)));
  --t-date: calc(var(--u) * 2.6 * var(--scale) * var(--fit));
}
body.theme-chalk {
  /* 칠판색 보드 */
  --board: #24372e;
  --frame: #6b5a43;
  --ink: #f4f2e8;
  --ink-soft: #9fb1a6;
  --ink-red: #ff9c8f;
  --ink-blue: #9fd0ff;
  --tag-bg: #111a15;
  --tag-fg: #f4f2e8;
  --tag-num: #ffd23f;
  --lens-ring: #f4f2e8;
  --hl-yellow: rgba(255, 214, 10, .28);
  --ui-bg: rgba(22, 32, 27, .95);
  --ui-fg: #f4f2e8;
  --ui-line: #3d5247;
  --ui-hover: #2f463b;
  --focus: #ffd23f;
}
body.font-dodum { --font-board: "Gowun Dodum", "Noto Sans KR", sans-serif; }
body.font-jua { --font-board: "Jua", "Noto Sans KR", sans-serif; }
body.font-myeongjo { --font-board: "Nanum Myeongjo", "Batang", serif; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  /* 16:9 바깥 여백(레터박스) */
  background: #0e0f0e;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--ink);
  font-family: var(--font-board);
  -webkit-font-smoothing: antialiased;
  transition: background .25s;
}

/* ───────── 보드 ───────── */
.board {
  position: relative;
  /* 16:9 고정 화면: 가로 100u × 세로 56.25u, 창 크기에 맞춰 통째로 확대·축소 */
  width: calc(var(--u) * 100);
  height: calc(var(--u) * 56.25);
  overflow: hidden;
  background: var(--board);
  padding-block: calc(var(--u) * 2.4 * var(--fit)) calc(var(--u) * 2.4 * var(--fit));
  padding-left: max(calc(var(--u) * 3), env(safe-area-inset-left, 0px), 16px);
  padding-right: max(calc(var(--u) * 3), env(safe-area-inset-right, 0px), 16px);
  display: grid;
  grid-template-columns: 31% 1fr;
  grid-template-rows: auto auto 1fr auto;
  grid-template-areas:
    "lens date"
    "lens question"
    "bank inquiry"
    "gen  gen";
  column-gap: calc(var(--u) * 3);
  row-gap: calc(var(--u) * 1.6 * var(--fit));
  transition: background .25s;
}

/* 날짜 */
.date {
  grid-area: date;
  justify-self: end;
  display: flex;
  align-items: center;
  gap: calc(var(--u) * .8);
  font-size: var(--t-date);
}
.date .f { min-width: 1.2em; text-align: center; }
.chip-tag {
  font-family: var(--font-label);
  font-weight: 900;
  font-size: calc(var(--u) * 1.7);
  padding: .32em .55em;
  border: 3px solid var(--tag-bg);
  border-radius: .35em;
  background: var(--board);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--tag-bg);
  line-height: 1;
}

/* 개념 렌즈 */
.lens-wrap {
  grid-area: lens;
  position: relative;
  align-self: start;
  justify-self: center;
  width: calc(var(--u) * 16 * var(--fit));
  aspect-ratio: 1;
  max-width: 100%;
}
.lens-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lens-wrap .ring { fill: none; stroke: var(--lens-ring); }
.lens-wrap .arc-text { fill: var(--board); font-family: var(--font-label); font-weight: 900; font-size: 13px; letter-spacing: 3px; dominant-baseline: central; }
.lens-wrap .handle { fill: var(--lens-ring); }
.lens-word {
  position: absolute;
  inset: 26% 12% 22%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: calc(var(--u) * 3.6 * var(--scale) * var(--fit));
  font-weight: 700;
  color: var(--ink-blue);
  line-height: 1.1;
  word-break: keep-all;
}
.lens-pick {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 8px;
  z-index: 20;
  width: max-content;
  max-width: min(90vw, 420px);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px;
  background: var(--ui-bg);
  border: 1px solid var(--ui-line);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  font-family: var(--font-label);
}
.lens-pick button { font-size: 15px; }

/* 라벨 태그 (실물 칠판 스티커) */
.tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .25em;
  flex: none;
  font-family: var(--font-label);
  font-weight: 900;
  font-size: var(--t-tag);
  color: var(--tag-fg);
  background: var(--tag-bg);
  padding: .55em 1.05em;
  border-radius: .3em;
  outline: 2px dashed rgba(255,255,255,.65);
  outline-offset: -.32em;
  box-shadow: 0 .14em .35em rgba(0,0,0,.25);
  white-space: nowrap;
  letter-spacing: .02em;
  line-height: 1.15;
}
.tag .num { color: var(--tag-num); }

/* 행 공통 */
.row { display: flex; align-items: flex-start; gap: calc(var(--u) * 2.4); min-width: 0; }
.row > .tag { margin-top: calc(var(--t-body) * .12); }

.question { grid-area: question; }
.inquiry { grid-area: inquiry; display: flex; flex-direction: column; gap: calc(var(--u) * 1.8 * var(--fit)); padding-top: calc(var(--u) * 1.5 * var(--fit)); }
.gen { grid-area: gen; padding-top: calc(var(--u) * 2 * var(--fit)); }

/* 입력 칸 */
.field {
  flex: 1;
  min-width: 0;
  font-size: var(--t-body);
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: keep-all;
  overflow-wrap: anywhere;
  border-radius: 8px;
  padding: .05em .25em;
  margin: -.05em -.25em;
  outline: none;
  cursor: text;
  transition: background .15s, box-shadow .15s;
}
.field:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.field:focus { background: color-mix(in srgb, var(--ink) 5%, transparent); box-shadow: inset 0 -3px 0 var(--focus); }
.field:empty::before { content: attr(data-ph); color: var(--ink-soft); opacity: .7; pointer-events: none; }
.f[contenteditable] { outline: none; border-radius: 6px; cursor: text; }
.f[contenteditable]:focus { box-shadow: inset 0 -3px 0 var(--focus); }
.f:empty::before { content: attr(data-ph); color: var(--ink-soft); opacity: .6; }

/* 색 강조 */
.hl-red { color: var(--ink-red); }
.hl-blue { color: var(--ink-blue); }
.hl-under { text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .18em; }
.hl-yellow { background: var(--hl-yellow); border-radius: .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* 빈칸 모드: 빨간 글씨가 빈칸이 되고, 누르면 하나씩 공개 */
body.blank-mode .board .hl-red:not(.revealed) {
  color: transparent;
  border-bottom: .08em solid var(--ink-red);
  cursor: pointer;
}
body.blank-mode .board .hl-red:not(.revealed)::selection { color: transparent; }

/* 탐구 활동 */
.inq-row { position: relative; }
.inq-row .field { line-height: 1.35; }

/* 개념 은행 */
.bank { grid-area: bank; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 2); padding-top: calc(var(--u) * 1.5); padding-left: calc(var(--u) * 1); min-width: 0; }
.words {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: calc(var(--u) * 1.2) calc(var(--u) * 3);
  padding-left: calc(var(--u) * 2);
  width: 100%;
}
.word {
  position: relative;
  font-size: var(--t-chip);
  color: var(--ink-blue);
  line-height: 1.3;
  cursor: pointer;
  user-select: none;
  border-radius: 6px;
  padding: 0 .1em;
  background: none;
  border: 0;
  font-family: inherit;
}
.word.on { text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .2em; }
.word:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.word-add {
  font-family: var(--font-board);
  font-size: max(15px, calc(var(--u) * 1.3));
  color: var(--ink);
  background: transparent;
  border: 2px dashed var(--ui-line);
  border-radius: 8px;
  padding: .25em .5em;
  width: 13em;
  max-width: 100%;
}
.word-add:focus { outline: none; border-color: var(--focus); }
.word-add::placeholder { color: var(--ink-soft); }

/* 지우기(×)·추가 버튼: 편집 중에만 */
.x {
  position: absolute;
  top: -.55em;
  right: -.75em;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 0;
  background: var(--ink-soft);
  color: var(--board);
  font: 700 14px/22px var(--font-label);
  padding: 0;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
}
.word:hover .x, .inq-row:hover .x, .x:focus-visible { opacity: 1; }
.inq-row .x { top: .2em; right: -.4em; }
.add-inq {
  align-self: flex-start;
  font-family: var(--font-label);
  font-size: 15px;
  color: var(--ink-soft);
  background: transparent;
  border: 2px dashed var(--ui-line);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
}
.add-inq:hover { color: var(--ink); border-color: var(--ink-soft); }

/* 발표 모드: 편집 흔적 숨김 */
body.present .x,
body.present .add-inq,
body.present .word-add,
body.present .field:empty::before,
body.present .f:empty::before { display: none; }
body.present .field:hover { background: none; }

/* ───────── 도구 막대 ───────── */
.toolbar {
  position: fixed;
  right: max(14px, env(safe-area-inset-right, 0px));
  bottom: max(14px, env(safe-area-inset-bottom, 0px));
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  max-width: calc(100vw - 28px);
  padding: 4px;
  background: var(--ui-bg);
  color: var(--ui-fg);
  border: 1px solid var(--ui-line);
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  font-family: var(--font-label);
  transition: opacity .25s;
}
body.present .toolbar { opacity: 0; pointer-events: none; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 500 14px/1 var(--font-label);
  color: var(--ui-fg);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { background: var(--ui-hover); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.btn.active { background: var(--ui-hover); border-color: var(--ui-line); font-weight: 700; }
.btn.warn { color: #c0392b; }
body.theme-chalk .btn.warn { color: #ff9c8f; }
.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 4px; width: 330px; max-width: 100%; padding: 4px 2px 6px; border-bottom: 1px solid var(--ui-line); }
.sep { flex-basis: 100%; height: 1px; background: var(--ui-line); margin: 2px 0; }
.toggle { font-weight: 700; }
.swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--ui-line); }
.swatch.white { background: #fbfbf7; }
.swatch.chalk { background: #24372e; }

/* 발표 모드 복귀 손잡이 */
.peek {
  position: fixed;
  right: max(10px, env(safe-area-inset-right, 0px));
  bottom: max(10px, env(safe-area-inset-bottom, 0px));
  z-index: 49;
  display: none;
  font: 500 13px/1 var(--font-label);
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  opacity: .35;
}
.peek:hover, .peek:focus-visible { opacity: 1; border-color: var(--ui-line); background: var(--ui-bg); color: var(--ui-fg); }
body.present .peek { display: block; }

/* 글자 서식 막대 (선택 시 표시) */
.fmt {
  position: fixed;
  z-index: 60;
  display: flex;
  gap: 2px;
  padding: 4px;
  background: var(--ui-bg);
  border: 1px solid var(--ui-line);
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.2);
  font-family: var(--font-label);
  transform: translate(-50%, -100%);
}
.fmt .btn { padding: 7px 9px; font-weight: 700; }
.fmt .r { color: var(--ink-red); }
.fmt .b { color: var(--ink-blue); }
.fmt .u { text-decoration: underline; }
.fmt .y { background: var(--hl-yellow); }

/* 저장 패널 */
.panel-back {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.panel {
  width: min(520px, 100%);
  max-height: 80vh;
  overflow: auto;
  background: var(--ui-bg);
  color: var(--ui-fg);
  border: 1px solid var(--ui-line);
  border-radius: 14px;
  padding: 20px;
  font-family: var(--font-label);
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.panel h2 { margin: 0 0 4px; font-size: 19px; }
.panel p.sub { margin: 0 0 16px; font-size: 13px; color: var(--ink-soft); }
.panel .save-row { display: flex; gap: 8px; margin-bottom: 16px; }
.panel h3 { margin: 18px 0 4px; font-size: 15px; }
.link-box { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; padding: 12px; border: 1px dashed var(--ui-line); border-radius: 10px; }
.link-box input { font-size: 12px !important; font-family: ui-monospace, Menlo, Consolas, monospace !important; }
.link-box .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.link-box a.btn { text-decoration: none; }
.link-box .hint { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
.panel input[type=text] {
  flex: 1; min-width: 0;
  font: 15px var(--font-label);
  color: var(--ui-fg);
  background: transparent;
  border: 1px solid var(--ui-line);
  border-radius: 8px;
  padding: 9px 11px;
}
.panel input[type=text]:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
.panel .primary { background: var(--tag-bg); color: var(--tag-fg); font-weight: 700; }
.panel .primary:hover { background: var(--tag-bg); opacity: .88; }
.lesson-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lesson-list li { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 8px 10px; border: 1px solid var(--ui-line); border-radius: 10px; }
.lesson-list .acts { display: flex; gap: 2px; }
.lesson-list .edit-row { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; }
.lesson-list .edit-row input { flex: 1 1 140px; }
.folder-group { margin: 0 0 14px; }
.folder-group > summary { cursor: pointer; font-weight: 700; font-size: 14px; padding: 6px 2px; list-style: none; display: flex; align-items: center; gap: 6px; }
.folder-group > summary::-webkit-details-marker { display: none; }
.folder-group > summary::before { content: "▸"; color: var(--ink-soft); }
.folder-group[open] > summary::before { content: "▾"; }
.folder-group .count { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
.panel .field-label { font-size: 12px; color: var(--ink-soft); margin: 0 0 4px; }
.panel .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.panel .two label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-soft); min-width: 0; }
.export-box { margin-top: 18px; padding: 12px; border-radius: 10px; background: var(--ui-hover); font-size: 13px; line-height: 1.55; }
.export-box p { margin: 0 0 8px; }
@media (max-width: 480px) { .panel .two { grid-template-columns: 1fr; } }
.lesson-list .meta { flex: 1; min-width: 0; }
.lesson-list .name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-list .when { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.empty-note { font-size: 14px; color: var(--ink-soft); padding: 12px 0; }
.panel .close-row { display: flex; justify-content: flex-end; margin-top: 16px; }

.toast {
  position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
  z-index: 80;
  background: var(--tag-bg); color: var(--tag-fg);
  font: 500 14px var(--font-label);
  padding: 10px 16px; border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}

/* 좁은 화면(휴대폰·세로 태블릿): 한 줄로 쌓기 */
@media (max-width: 760px) and (orientation: portrait) {
  :root { --u: 2.2vw; }
  body { display: block; overflow: auto; background: var(--board); }
  .board {
    width: auto;
    height: auto;
    min-height: 100%;
    grid-template-columns: 1fr;
    grid-template-areas: "date" "lens" "question" "bank" "inquiry" "gen";
    padding-bottom: 120px;
  }
  .lens-wrap { width: 36vw; }
  .row { flex-direction: column; gap: 10px; }
  .inquiry, .bank { padding-top: 0; }
  :root { --t-body: calc(5.2vw * var(--scale)); --t-chip: calc(5vw * var(--scale)); --t-tag: 3.8vw; --t-date: 5vw; }
  .chip-tag { font-size: 3.6vw; }
  .lens-word { font-size: calc(7vw * var(--scale)); }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<main class="board" id="board">
  <!-- 개념 렌즈 -->
  <div class="lens-wrap">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <path id="arc" d="M 20 100 A 80 80 0 0 1 180 100"></path>
      </defs>
      <rect class="handle" x="150" y="28" width="46" height="22" rx="8" transform="rotate(-28 173 39)"></rect>
      <circle class="ring" cx="100" cy="100" r="80" stroke-width="16"></circle>
      <circle class="ring" cx="100" cy="100" r="67" stroke-width="2" opacity=".35"></circle>
      <text class="arc-text" text-anchor="middle"><textPath href="#arc" startOffset="38%">개념렌즈</textPath></text>
    </svg>
    <div class="lens-word field" id="lens" data-key="lens" data-single="1" data-ph="렌즈" contenteditable="true" spellcheck="false" aria-label="개념 렌즈"></div>
    <div class="lens-pick" id="lensPick" hidden></div>
  </div>

  <!-- 날짜 -->
  <div class="date" aria-label="날짜">
    <span class="f" id="d-m" data-key="m" contenteditable="true" spellcheck="false" data-ph="10" aria-label="월"></span>
    <span class="chip-tag">월</span>
    <span class="f" id="d-d" data-key="d" contenteditable="true" spellcheck="false" data-ph="22" aria-label="일"></span>
    <span class="chip-tag">일</span>
    <span class="f" id="d-w" data-key="w" contenteditable="true" spellcheck="false" data-ph="목" aria-label="요일"></span>
    <span class="chip-tag">요일</span>
  </div>

  <!-- 탐구 질문 -->
  <section class="row question">
    <span class="tag">탐구 질문</span>
    <div class="field" id="question" data-key="question" data-ph="탐구 질문을 입력하세요" contenteditable="true" spellcheck="false"></div>
  </section>

  <!-- 개념 은행 -->
  <section class="bank">
    <span class="tag">개념 은행</span>
    <div class="words" id="words"></div>
    <input class="word-add" id="wordAdd" type="text" placeholder="+ 개념어 입력 후 Enter" aria-label="개념어 추가" autocomplete="off">
  </section>

  <!-- 탐구 활동 -->
  <section class="inquiry" id="inquiry"></section>

  <!-- 일반화 문장 -->
  <section class="row gen">
    <span class="tag">일반화문장</span>
    <div class="field" id="gen" data-key="gen" data-autoparen="1" data-ph="일반화 문장을 입력하세요. ( )로 감싼 낱말은 빨간색이 됩니다." contenteditable="true" spellcheck="false"></div>
  </section>
</main>

<!-- 도구 막대 -->
<nav class="toolbar" id="toolbar" aria-label="칠판 도구">
  <div class="tools" id="tools" hidden>
  <button class="btn" id="tTheme" type="button" title="배경 바꾸기"><span class="swatch white" id="swatch"></span><span id="themeLabel">흰 보드</span></button>
  <button class="btn" id="tFont" type="button" title="글꼴 바꾸기">글꼴: <span id="fontLabel">고딕</span></button>
  <span class="sep"></span>
  <button class="btn" id="tSmaller" type="button" title="글자 작게" aria-label="글자 작게">가−</button>
  <button class="btn" id="tBigger" type="button" title="글자 크게" aria-label="글자 크게">가+</button>
  <span class="sep"></span>
  <button class="btn" id="tBlank" type="button" title="빨간 글씨를 빈칸으로 가리기">빈칸 모드</button>
  <button class="btn" id="tToday" type="button" title="오늘 날짜로">오늘 날짜</button>
  <button class="btn" id="tLessons" type="button">수업 저장·불러오기</button>
  <button class="btn warn" id="tClear" type="button">새 칠판</button>
  <span class="sep"></span>
  <button class="btn" id="tFull" type="button" title="전체 화면">전체화면</button>
  <button class="btn active" id="tPresent" type="button" title="편집 표시를 숨기고 보여주기만">발표 모드</button>
  </div>
  <button class="btn toggle" id="tToggle" type="button" aria-expanded="false" aria-controls="tools">도구 ▴</button>
</nav>
<button class="peek" id="peek" type="button">편집하기</button>

<!-- 선택한 글자 서식 -->
<div class="fmt" id="fmt" hidden>
  <button class="btn r" type="button" data-hl="hl-red">빨강</button>
  <button class="btn b" type="button" data-hl="hl-blue">파랑</button>
  <button class="btn u" type="button" data-hl="hl-under">밑줄</button>
  <button class="btn y" type="button" data-hl="hl-yellow">형광</button>
  <button class="btn" type="button" data-hl="">지우기</button>
</div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "conceptboard.current.v1";
  var LESSONS_KEY = "conceptboard.lessons.v1";
  var PREF_KEY = "conceptboard.prefs.v1";
  var WEEK = ["일", "월", "화", "수", "목", "금", "토"];
  var LENSES = ["관계", "변화", "관점", "원인과 결과", "형태", "기능", "체계", "연결", "책임", "패턴", "다양성", "상호작용", "공동체", "균형", "정체성"];
  var FONTS = [
    { cls: "", label: "고딕" },
    { cls: "font-dodum", label: "고운돋움" },
    { cls: "font-jua", label: "주아" },
    { cls: "font-myeongjo", label: "명조" }
  ];
  var ALLOWED = ["hl-red", "hl-blue", "hl-under", "hl-yellow"];
  // 수업 링크는 단독 웹페이지(GitHub Pages 등)에서만 씀. 다른 페이지 안에 끼워 보일 때는 주소를 쓸 수 없어 숨김
  var LINKS_OK = (function () { try { return window.self === window.top; } catch (e) { return false; } })();

  function store(key, val) {
    try {
      if (val === undefined) { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }

  function todayParts() {
    var now = new Date();
    return { m: String(now.getMonth() + 1), d: String(now.getDate()), w: WEEK[now.getDay()] };
  }

  function sample() {
    var t = todayParts();
    return {
      m: t.m, d: t.d, w: t.w,
      lens: "관계",
      question: "내가 선택한 음식과 건강은\n어떤 관계가 있을까?",
      words: [
        { text: "건강", on: false },
        { text: "식품군", on: true },
        { text: "영양소", on: false },
        { text: "균형", on: false }
      ],
      inquiries: ["스펙트럼 입장진술문", "써클 맵 → 식판 구성하기", "핵심단어 찾기"],
      gen: '다양한 (<span class="hl-red">식품군</span>)을 (<span class="hl-red">균형</span>) 있게 선택하면\n(<span class="hl-red">건강</span>)에 도움이 된다.'
    };
  }

  function blank() {
    var t = todayParts();
    return { m: t.m, d: t.d, w: t.w, lens: "", question: "", words: [], inquiries: ["", "", ""], gen: "" };
  }

  /* ───── 안전한 HTML 정리: 글자·줄바꿈·허용된 강조만 남김 ───── */
  function cleanNode(node, out) {
    node.childNodes.forEach(function (n) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      var tag = n.tagName;
      if (tag === "BR") { out.appendChild(document.createTextNode("\n")); return; }
      var cls = (n.className && typeof n.className === "string") ? n.className.split(/\s+/).filter(function (c) { return ALLOWED.indexOf(c) > -1; }) : [];
      var isBlock = /^(DIV|P|LI)$/.test(tag);
      if (isBlock && out.lastChild && !/\n$/.test(out.textContent)) out.appendChild(document.createTextNode("\n"));
      if (cls.length) {
        var s = document.createElement("span");
        s.className = cls.join(" ");
        cleanNode(n, s);
        if (s.textContent) out.appendChild(s);
      } else {
        cleanNode(n, out);
      }
    });
  }
  function cleanHTML(el) {
    var tmp = document.createElement("div");
    cleanNode(el, tmp);
    tmp.normalize();
    var html = tmp.innerHTML.replace(/\n+$/, "");
    return html;
  }
  function setHTML(el, html) {
    var src = document.createElement("div");
    src.innerHTML = html || "";
    var out = document.createElement("div");
    cleanNode(src, out);
    el.innerHTML = out.innerHTML;
  }

  /* ( ) 안의 낱말을 빨간색으로 */
  function autoParen(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (tn) {
      if (tn.parentNode !== el) return;
      var text = tn.nodeValue;
      var re = /\(([^()\n]*[^()\s][^()\n]*)\)/g;
      if (!re.test(text)) return;
      re.lastIndex = 0;
      var frag = document.createDocumentFragment();
      var last = 0, m;
      while ((m = re.exec(text))) {
        frag.appendChild(document.createTextNode(text.slice(last, m.index) + "("));
        var inner = m[1];
        var lead = inner.match(/^\s*/)[0], trail = inner.match(/\s*$/)[0];
        if (lead) frag.appendChild(document.createTextNode(lead));
        var s = document.createElement("span");
        s.className = "hl-red";
        s.textContent = inner.trim();
        frag.appendChild(s);
        frag.appendChild(document.createTextNode(trail + ")"));
        last = m.index + m[0].length;
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      el.replaceChild(frag, tn);
    });
  }

  var state = store(STORE_KEY) || sample();
  var prefs = store(PREF_KEY) || { theme: "white", font: 0, scale: 1 };

  var $ = function (id) { return document.getElementById(id); };
  var fieldEls = function () { return Array.prototype.slice.call(document.querySelectorAll("[data-key]")); };

  var BASE_TITLE = document.title;
  var linkActive = false;
  function save() {
    store(STORE_KEY, state);
    // 링크로 연 칠판을 고치기 시작하면 주소와 제목을 원래대로 (새로고침 때 링크 내용으로 되돌아가지 않도록)
    if (linkActive) {
      linkActive = false;
      document.title = BASE_TITLE;
      try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) { /* 무시 */ }
    }
  }
  function savePrefs() { store(PREF_KEY, prefs); }

  /* ───── 그리기 ───── */
  function renderFields() {
    fieldEls().forEach(function (el) { setHTML(el, state[el.dataset.key] || ""); });
  }

  function renderWords() {
    var box = $("words");
    box.innerHTML = "";
    state.words.forEach(function (w, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "word" + (w.on ? " on" : "");
      b.title = "눌러서 밑줄 강조";
      b.textContent = w.text;
      b.addEventListener("click", function (e) {
        if (e.target.classList.contains("x")) return;
        w.on = !w.on; save(); renderWords(); fit();
      });
      var x = document.createElement("span");
      x.className = "x";
      x.setAttribute("role", "button");
      x.setAttribute("aria-label", w.text + " 지우기");
      x.textContent = "×";
      x.addEventListener("click", function (e) {
        e.stopPropagation();
        state.words.splice(i, 1); save(); renderWords();
      });
      b.appendChild(x);
      box.appendChild(b);
    });
  }

  function renderInquiries() {
    var box = $("inquiry");
    box.innerHTML = "";
    state.inquiries.forEach(function (html, i) {
      var row = document.createElement("div");
      row.className = "row inq-row";
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.innerHTML = '탐구 <span class="num">' + (i + 1) + "</span>";
      var f = document.createElement("div");
      f.className = "field";
      f.contentEditable = "true";
      f.spellcheck = false;
      f.dataset.ph = "탐구 활동 " + (i + 1);
      f.dataset.inq = String(i);
      setHTML(f, html);
      bindField(f, function (val) { state.inquiries[i] = val; });
      var x = document.createElement("button");
      x.type = "button";
      x.className = "x";
      x.setAttribute("aria-label", "탐구 " + (i + 1) + " 지우기");
      x.textContent = "×";
      x.addEventListener("click", function () {
        state.inquiries.splice(i, 1); save(); renderInquiries();
      });
      row.appendChild(tag); row.appendChild(f); row.appendChild(x);
      box.appendChild(row);
    });
    if (state.inquiries.length < 6) {
      var add = document.createElement("button");
      add.type = "button";
      add.className = "add-inq";
      add.textContent = "+ 탐구 추가";
      add.addEventListener("click", function () {
        state.inquiries.push(""); save(); renderInquiries();
        var fs = box.querySelectorAll(".field");
        fs[fs.length - 1].focus();
      });
      box.appendChild(add);
    }
    fit();
  }

  function applyPrefs() {
    document.body.classList.toggle("theme-chalk", prefs.theme === "chalk");
    $("themeLabel").textContent = prefs.theme === "chalk" ? "칠판색" : "흰 보드";
    $("swatch").className = "swatch " + (prefs.theme === "chalk" ? "chalk" : "white");
    FONTS.forEach(function (f) { if (f.cls) document.body.classList.remove(f.cls); });
    var f = FONTS[prefs.font] || FONTS[0];
    if (f.cls) document.body.classList.add(f.cls);
    $("fontLabel").textContent = f.label;
    document.documentElement.style.setProperty("--scale", prefs.scale);
    if (typeof fit === "function") fit();
  }

  /* ───── 입력 칸 동작 ───── */
  function bindField(el, setter) {
    var single = el.dataset.single === "1" || el.classList.contains("f");
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.isComposing) {
        e.preventDefault();
        if (single || e.ctrlKey || e.metaKey) { el.blur(); return; }
        if (atEnd(el)) {
          // 맨 끝에서는 새 줄이 보이도록 보조 줄바꿈을 하나 더 넣고 커서를 그 앞에 둡니다 (저장 시 끝 줄바꿈은 지워짐)
          insertText("\n\n");
          var sel = window.getSelection();
          if (sel.modify) sel.modify("move", "backward", "character");
        } else {
          insertText("\n");
        }
      }
      if (e.key === "Escape") el.blur();
    });
    el.addEventListener("paste", function (e) {
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
      if (single) t = t.replace(/\s*\n\s*/g, " ");
      insertText(t);
    });
    el.addEventListener("input", function () {
      setter(cleanHTML(el));
      save();
      fit();
    });
    el.addEventListener("blur", function () {
      if (el.dataset.autoparen) autoParen(el);
      var html = cleanHTML(el);
      setHTML(el, html);
      setter(html);
      save();
    });
  }
  function atEnd(el) {
    var sel = window.getSelection();
    if (!sel.rangeCount) return false;
    var r = sel.getRangeAt(0).cloneRange();
    r.setEnd(el, el.childNodes.length);
    return r.toString() === "";
  }
  function insertText(t) {
    if (!document.execCommand("insertText", false, t)) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      var r = sel.getRangeAt(0);
      r.deleteContents();
      var n = document.createTextNode(t);
      r.insertNode(n);
      r.setStartAfter(n); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r);
    }
  }

  fieldEls().forEach(function (el) {
    bindField(el, function (val) { state[el.dataset.key] = val; });
  });

  /* 렌즈 고르기 */
  var pick = $("lensPick");
  LENSES.forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.textContent = name;
    b.addEventListener("mousedown", function (e) { e.preventDefault(); });
    b.addEventListener("click", function () {
      state.lens = name; setHTML($("lens"), name); save();
      $("lens").blur();
    });
    pick.appendChild(b);
  });
  $("lens").addEventListener("focus", function () { if (!document.body.classList.contains("present")) pick.hidden = false; });
  $("lens").addEventListener("blur", function () { pick.hidden = true; });

  /* 개념어 추가 */
  $("wordAdd").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.isComposing) return;
    e.preventDefault();
    var v = this.value.replace(/[,\s]+$/, "").trim();
    if (!v) return;
    v.split(/\s*,\s*/).forEach(function (t) { if (t) state.words.push({ text: t, on: false }); });
    this.value = "";
    save(); renderWords(); fit();
  });

  /* ───── 선택한 글자에 색 입히기 ───── */
  var fmt = $("fmt");
  function activeField() {
    var sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return null;
    var n = sel.anchorNode;
    while (n && n !== document.body) {
      if (n.nodeType === 1 && n.classList.contains("field")) return n;
      n = n.parentNode;
    }
    return null;
  }
  document.addEventListener("selectionchange", function () {
    var f = activeField();
    if (!f || document.body.classList.contains("present") && !f.matches(":focus")) { fmt.hidden = true; return; }
    var rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
    if (!rect.width) { fmt.hidden = true; return; }
    fmt.hidden = false;
    var left = Math.min(Math.max(rect.left + rect.width / 2, 130), window.innerWidth - 130);
    fmt.style.left = left + "px";
    fmt.style.top = Math.max(rect.top - 8, 52) + "px";
  });
  fmt.addEventListener("mousedown", function (e) { e.preventDefault(); });
  fmt.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var f = activeField();
    if (!f) return;
    var sel = window.getSelection();
    var r = sel.getRangeAt(0);
    var frag = r.extractContents();
    // 기존 강조 벗기기
    var holder = document.createElement("div");
    holder.appendChild(frag);
    holder.querySelectorAll("span").forEach(function (s) { s.replaceWith.apply(s, Array.prototype.slice.call(s.childNodes)); });
    var node;
    if (b.dataset.hl) {
      node = document.createElement("span");
      node.className = b.dataset.hl;
      while (holder.firstChild) node.appendChild(holder.firstChild);
    } else {
      node = document.createDocumentFragment();
      while (holder.firstChild) node.appendChild(holder.firstChild);
    }
    var lastChild = node.nodeType === 11 ? node.lastChild : node;
    r.insertNode(node);
    f.normalize();
    sel.removeAllRanges();
    fmt.hidden = true;
    f.dispatchEvent(new Event("input"));
    f.focus();
    if (lastChild && lastChild.parentNode) {
      var nr = document.createRange();
      nr.setStartAfter(lastChild); nr.collapse(true);
      sel.addRange(nr);
    }
  });

  /* 빈칸 모드: 가려진 낱말 누르면 공개 */
  document.addEventListener("click", function (e) {
    if (!document.body.classList.contains("blank-mode")) return;
    var s = e.target.closest && e.target.closest(".board .hl-red");
    if (!s) return;
    if (!s.classList.contains("revealed")) {
      e.preventDefault();
      s.classList.add("revealed");
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
  }, true);

  /* ───── 도구 막대 ───── */
  $("tTheme").addEventListener("click", function () {
    prefs.theme = prefs.theme === "chalk" ? "white" : "chalk"; savePrefs(); applyPrefs();
  });
  $("tFont").addEventListener("click", function () {
    prefs.font = (prefs.font + 1) % FONTS.length; savePrefs(); applyPrefs();
  });
  $("tBigger").addEventListener("click", function () {
    prefs.scale = Math.min(1.6, Math.round((prefs.scale + 0.1) * 10) / 10); savePrefs(); applyPrefs();
  });
  $("tSmaller").addEventListener("click", function () {
    prefs.scale = Math.max(0.6, Math.round((prefs.scale - 0.1) * 10) / 10); savePrefs(); applyPrefs();
  });
  $("tToday").addEventListener("click", function () {
    var t = todayParts();
    state.m = t.m; state.d = t.d; state.w = t.w; save(); renderFields();
  });
  $("tBlank").addEventListener("click", function () {
    var on = document.body.classList.toggle("blank-mode");
    this.classList.toggle("active", on);
    document.querySelectorAll(".hl-red.revealed").forEach(function (s) { s.classList.remove("revealed"); });
    toast(on ? "빨간 낱말이 빈칸이 되었습니다. 빈칸을 누르면 하나씩 보입니다." : "빈칸 모드를 껐습니다.");
  });

  function setPresent(on) {
    document.body.classList.toggle("present", on);
    $("tPresent").classList.toggle("active", on);
    fit();
    if (on) { fmt.hidden = true; pick.hidden = true; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
  }
  $("tPresent").addEventListener("click", function () { setPresent(true); });
  $("tToggle").addEventListener("click", function () {
    var open = $("tools").hidden;
    $("tools").hidden = !open;
    this.setAttribute("aria-expanded", String(open));
    this.textContent = open ? "도구 닫기 ▾" : "도구 ▴";
  });
  $("peek").addEventListener("click", function () { setPresent(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.body.classList.contains("present") && !document.activeElement.isContentEditable) setPresent(false);
  });

  $("tFull").addEventListener("click", function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () { toast("이 화면에서는 전체화면을 쓸 수 없습니다. 브라우저의 F11 키를 눌러 주세요."); });
    } catch (e) { toast("이 화면에서는 전체화면을 쓸 수 없습니다. 브라우저의 F11 키를 눌러 주세요."); }
  });

  var clearArmed = null;
  $("tClear").addEventListener("click", function () {
    var b = this;
    if (!clearArmed) {
      b.textContent = "한 번 더 누르면 지워집니다";
      clearArmed = setTimeout(function () { b.textContent = "새 칠판"; clearArmed = null; }, 3000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null;
    b.textContent = "새 칠판";
    state = blank(); save(); renderAll();
    toast("새 칠판을 준비했습니다.");
  });

  /* ───── 수업 저장·불러오기 ───── */
  function lessons() { return store(LESSONS_KEY) || []; }
  function folderNames() {
    var seen = {};
    return lessons().map(function (l) { return l.folder || ""; }).filter(function (f) { if (!f || seen[f]) return false; seen[f] = 1; return true; });
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* 저장한 수업 전체를 브라우저 북마크 파일(크롬·엣지·웨일 가져오기용)로 만들기 */
  function exportBookmarks() {
    var all = lessons();
    if (!all.length) { toast("먼저 수업을 저장해 주세요."); return; }
    toast("북마크 파일을 만드는 중입니다…");
    Promise.all(all.map(function (l) { return makeLink(l.name, l.state, l.folder); })).then(function (urls) {
      var groups = {}, order = [];
      all.forEach(function (l, i) {
        var f = l.folder || "";
        if (!groups[f]) { groups[f] = []; order.push(f); }
        groups[f].push('        <DT><A HREF="' + esc(urls[i]) + '">' + esc(l.name) + "</A>");
      });
      order.sort(function (a, b) { return a === "" ? 1 : b === "" ? -1 : a.localeCompare(b, "ko"); });
      var now = Math.floor(Date.now() / 1000);
      var body = order.map(function (f) {
        if (!f) return groups[f].map(function (x) { return x.slice(4); }).join("\n");
        return '    <DT><H3 ADD_DATE="' + now + '">' + esc(f) + "</H3>\n    <DL><p>\n" + groups[f].join("\n") + "\n    </DL><p>";
      }).join("\n");
      var html = "<!DOCTYPE NETSCAPE-Bookmark-file-1>\n" +
        '<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n' +
        "<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n" +
        '<DT><H3 ADD_DATE="' + now + '">개념기반 탐구 칠판</H3>\n<DL><p>\n' +
        '    <DT><A HREF="' + esc(location.href.split("#")[0]) + '">빈 칠판 열기</A>\n' +
        body + "\n</DL><p>\n</DL><p>\n";
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      var d = new Date();
      a.download = "conceptboard-bookmarks-" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + ".html";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast("북마크 파일을 내려받았습니다. 아래 안내대로 브라우저에서 가져오세요.");
    });
  }

  function openLessons() {
    var back = document.createElement("div");
    back.className = "panel-back";
    var suggested = (state.lens ? "[" + state.lens + "] " : "") + (document.getElementById("question").textContent.replace(/\s+/g, " ").trim().slice(0, 30) || "수업");
    back.innerHTML =
      '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">' +
      '<h2 id="pTitle">수업 저장·불러오기</h2>' +
      '<p class="sub">이 컴퓨터의 브라우저에 저장됩니다.' + (LINKS_OK ? ' 다른 기기에서 열려면 <b>수업 링크</b>나 <b>북마크 파일</b>을 쓰세요.' : ' 다른 컴퓨터에서는 보이지 않습니다.') + '</p>' +
      '<div class="two">' +
      '<label>폴더 (단원·과목)<input type="text" id="lessonFolder" list="folderList" placeholder="예: 실과 2단원 식생활" autocomplete="off"></label>' +
      '<label>북마크 제목 (수업 이름)<input type="text" id="lessonName" autocomplete="off"></label>' +
      '</div><datalist id="folderList"></datalist>' +
      '<div class="save-row"><button class="btn primary" type="button" id="lessonSave">지금 칠판 저장</button>' +
      (LINKS_OK ? '<button class="btn" type="button" id="lessonLink">🔗 수업 링크 만들기</button>' : '') + '</div>' +
      (LINKS_OK ? '<div id="linkSlot"></div>' : '') +
      '<h3>저장한 수업</h3>' +
      '<div id="lessonList"></div>' +
      (LINKS_OK ?
        '<div class="export-box"><p><b>📁 브라우저 북마크 폴더로 내보내기</b><br>저장한 수업 전체가 폴더별로 정리된 북마크 파일을 내려받습니다. 브라우저에서 가져오면 <b>‘개념기반 탐구 칠판’</b> 폴더 안에 폴더·수업 이름 그대로 북마크가 생깁니다.</p>' +
        '<button class="btn primary" type="button" id="lessonExport">북마크 파일 내려받기</button></div>' : '') +
      '<div class="close-row"><button class="btn" type="button" id="lessonClose">닫기</button></div>' +
      "</div>";
    document.body.appendChild(back);
    var nameIn = back.querySelector("#lessonName");
    var folderIn = back.querySelector("#lessonFolder");
    nameIn.value = suggested;
    folderIn.value = store("conceptboard.lastFolder.v1") || "";
    function close() { back.remove(); }
    function fillFolders() {
      back.querySelector("#folderList").innerHTML = folderNames().map(function (f) { return '<option value="' + esc(f) + '"></option>'; }).join("");
    }
    function draw() {
      fillFolders();
      var box = back.querySelector("#lessonList");
      var all = lessons();
      box.innerHTML = "";
      if (!all.length) { box.innerHTML = '<p class="empty-note">아직 저장한 수업이 없습니다. 위에서 폴더와 제목을 정하고 저장해 보세요.</p>'; return; }
      var order = folderNames().sort(function (a, b) { return a.localeCompare(b, "ko"); });
      if (all.some(function (l) { return !l.folder; })) order.push("");
      order.forEach(function (f) {
        var items = all.map(function (l, i) { return { l: l, i: i }; }).filter(function (x) { return (x.l.folder || "") === f; });
        var det = document.createElement("details");
        det.className = "folder-group";
        det.open = true;
        var sum = document.createElement("summary");
        sum.textContent = "📁 " + (f || "폴더 없음") + " ";
        var cnt = document.createElement("span"); cnt.className = "count"; cnt.textContent = items.length + "개";
        sum.appendChild(cnt);
        det.appendChild(sum);
        var ul = document.createElement("ul"); ul.className = "lesson-list";
        items.forEach(function (x) { ul.appendChild(row(x.l, x.i)); });
        det.appendChild(ul);
        box.appendChild(det);
      });
    }
    function row(l, i) {
      var li = document.createElement("li");
      var meta = document.createElement("div"); meta.className = "meta";
      var nm = document.createElement("div"); nm.className = "name"; nm.textContent = l.name;
      var wh = document.createElement("div"); wh.className = "when"; wh.textContent = new Date(l.at).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
      meta.appendChild(nm); meta.appendChild(wh);
      var acts = document.createElement("div"); acts.className = "acts";
      function b(label, fn, cls) {
        var x = document.createElement("button"); x.type = "button"; x.className = "btn" + (cls ? " " + cls : ""); x.textContent = label;
        x.addEventListener("click", fn); acts.appendChild(x); return x;
      }
      b("불러오기", function () {
        state = JSON.parse(JSON.stringify(l.state));
        var t = todayParts(); state.m = t.m; state.d = t.d; state.w = t.w;
        save(); renderAll(); close(); toast("‘" + l.name + "’ 수업을 불러왔습니다.");
      });
      if (LINKS_OK) b("링크", function () { showLink(l.name, l.state, l.folder); });
      b("이름·폴더", function () {
        if (li.querySelector(".edit-row")) return;
        var er = document.createElement("div"); er.className = "edit-row";
        er.innerHTML = '<input type="text" class="e-folder" list="folderList" placeholder="폴더" aria-label="폴더"><input type="text" class="e-name" placeholder="북마크 제목" aria-label="북마크 제목"><button class="btn primary" type="button">바꾸기</button>';
        er.querySelector(".e-folder").value = l.folder || "";
        er.querySelector(".e-name").value = l.name;
        er.querySelector("button").addEventListener("click", function () {
          var arr = lessons();
          arr[i].name = er.querySelector(".e-name").value.trim() || l.name;
          arr[i].folder = er.querySelector(".e-folder").value.trim();
          store(LESSONS_KEY, arr); draw(); toast("바꿨습니다.");
        });
        li.appendChild(er);
        er.querySelector(".e-name").focus();
      });
      var armed = false;
      var del = b("삭제", function () {
        if (!armed) { armed = true; del.textContent = "정말 삭제"; return; }
        var arr = lessons(); arr.splice(i, 1); store(LESSONS_KEY, arr); draw();
      }, "warn");
      li.appendChild(meta); li.appendChild(acts);
      return li;
    }
    function showLink(name, st, folder) {
      var slot = back.querySelector("#linkSlot");
      slot.innerHTML = '<div class="link-box"><p class="hint">링크를 만드는 중…</p></div>';
      makeLink(name, st, folder).then(function (url) {
        slot.innerHTML =
          '<div class="link-box">' +
          '<b style="font-size:14px"></b>' +
          '<input type="text" id="linkText" readonly aria-label="수업 링크">' +
          '<div class="acts"><button class="btn primary" type="button" id="linkCopy">링크 복사</button>' +
          '<a class="btn" id="linkOpen" target="_blank" rel="noopener">새 탭에서 열기 (북마크용)</a></div>' +
          '<p class="hint">새 탭에서 열면 탭 제목이 수업 이름으로 바뀝니다. 그 상태에서 <b>Ctrl+D</b>(휴대폰은 ☆)를 누르고 폴더를 고르면 수업 이름 그대로 북마크됩니다. 링크를 아는 사람은 누구나 내용을 볼 수 있습니다.</p>' +
          '</div>';
        slot.querySelector("b").textContent = (folder ? folder + " › " : "") + name;
        var inp = slot.querySelector("#linkText");
        inp.value = url;
        slot.querySelector("#linkOpen").href = url;
        inp.addEventListener("focus", function () { inp.select(); });
        slot.querySelector("#linkCopy").addEventListener("click", function () {
          function fallback() { inp.focus(); inp.select(); toast("링크를 선택했습니다. Ctrl+C로 복사하세요."); }
          try {
            navigator.clipboard.writeText(url).then(function () { toast("링크를 복사했습니다."); }, fallback);
          } catch (e) { fallback(); }
        });
      });
    }
    back.querySelector("#lessonSave").addEventListener("click", function () {
      var name = nameIn.value.trim() || "이름 없는 수업";
      var folder = folderIn.value.trim();
      store("conceptboard.lastFolder.v1", folder);
      var arr = lessons().filter(function (l) { return !(l.name === name && (l.folder || "") === folder); });
      arr.unshift({ name: name, folder: folder, at: Date.now(), state: JSON.parse(JSON.stringify(state)) });
      store(LESSONS_KEY, arr);
      if (!store(LESSONS_KEY)) { toast("이 브라우저에서는 저장이 막혀 있습니다."); return; }
      draw(); toast("‘" + (folder ? folder + " › " : "") + name + "’ 저장했습니다.");
    });
    if (LINKS_OK) {
      back.querySelector("#lessonLink").addEventListener("click", function () {
        showLink(nameIn.value.trim() || "이름 없는 수업", state, folderIn.value.trim());
      });
      back.querySelector("#lessonExport").addEventListener("click", exportBookmarks);
    }
    back.querySelector("#lessonClose").addEventListener("click", close);
    back.addEventListener("click", function (e) { if (e.target === back) close(); });
    back.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    draw();
    nameIn.focus(); nameIn.select();
  }
  $("tLessons").addEventListener("click", openLessons);

  var toastTimer;
  function toast(msg) {
    var t = document.querySelector(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 2600);
  }

  function renderAll() { renderFields(); renderWords(); renderInquiries(); fit(); }

  /* 글이 길어 16:9 화면을 넘치면 글자를 조금씩 줄여 한 화면에 맞춤 */
  var fitTimer;
  function fit() {
    cancelAnimationFrame(fitTimer);
    fitTimer = requestAnimationFrame(function () {
      var board = $("board"), root = document.documentElement, f = 1;
      root.style.setProperty("--fit", 1);
      if (getComputedStyle(board).overflow !== "hidden") return;
      while (board.scrollHeight > board.clientHeight + 1 && f > 0.45) {
        f = Math.round((f - 0.05) * 100) / 100;
        root.style.setProperty("--fit", f);
      }
    });
  }
  window.addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ───── 수업 링크: 칠판 내용을 주소(#수업=…) 안에 담아 어느 기기에서든 열기 ───── */
  function b64url(bytes) {
    var bin = "";
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64url(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function pipe(bytes, stream) {
    return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function makeLink(name, st, folder) {
    var payload = { v: 1, n: name, f: folder || "", s: { lens: st.lens, question: st.question, words: st.words, inquiries: st.inquiries, gen: st.gen } };
    var raw = new TextEncoder().encode(JSON.stringify(payload));
    var base = location.href.split("#")[0];
    var done = function (code) { return base + "#lesson=" + code; };
    if (typeof CompressionStream === "undefined") return Promise.resolve(done("j" + b64url(raw)));
    return pipe(raw, new CompressionStream("deflate-raw"))
      .then(function (z) { return done("z" + b64url(z)); })
      .catch(function () { return done("j" + b64url(raw)); });
  }
  function readLink(code) {
    var kind = code.charAt(0), bytes = unb64url(code.slice(1));
    var p = kind === "z" ? pipe(bytes, new DecompressionStream("deflate-raw")) : Promise.resolve(bytes);
    return p.then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
  }
  function sameBoard(a, b) {
    var k = ["lens", "question", "words", "inquiries", "gen"];
    return k.every(function (x) { return JSON.stringify(a[x]) === JSON.stringify(b[x]); });
  }
  function isEmptyBoard(a) {
    return !a.lens && !a.question && !a.gen && !(a.words || []).length && !(a.inquiries || []).some(Boolean);
  }
  function openFromHash() {
    var m = location.hash.match(/^#lesson=([jz][A-Za-z0-9_-]+)$/);
    if (!m) return;
    readLink(m[1]).then(function (data) {
      var s2 = data.s || {};
      var next = {
        lens: String(s2.lens || ""), question: String(s2.question || ""), gen: String(s2.gen || ""),
        words: (s2.words || []).map(function (w) { return { text: String(w.text || ""), on: !!w.on }; }).filter(function (w) { return w.text; }),
        inquiries: (s2.inquiries || []).map(String).slice(0, 6)
      };
      var t = todayParts(); next.m = t.m; next.d = t.d; next.w = t.w;
      var name = String(data.n || "링크로 연 수업").slice(0, 80);
      var folder = String(data.f || "").slice(0, 40);
      var arr = lessons();
      // 지금 칠판에 다른 내용이 있으면 덮어쓰기 전에 자동 백업
      if (!isEmptyBoard(state) && !sameBoard(state, next) && !arr.some(function (l) { return sameBoard(l.state, state); })) {
        arr.unshift({ name: "자동 백업 " + new Date().toLocaleString("ko-KR", { dateStyle: "short", timeStyle: "short" }), at: Date.now(), state: JSON.parse(JSON.stringify(state)) });
      }
      // 링크로 연 수업을 이 기기의 저장 목록에도 넣어 둠
      arr = arr.filter(function (l) { return !(l.name === name && (l.folder || "") === folder); });
      arr.unshift({ name: name, folder: folder, at: Date.now(), state: JSON.parse(JSON.stringify(next)) });
      store(LESSONS_KEY, arr);
      state = next; save(); renderAll();
      // 수업을 고치기 전까지는 주소에 수업을 남기고 탭 제목을 수업 이름으로 → 이 상태에서 Ctrl+D 하면 수업 이름으로 북마크됨
      linkActive = true;
      document.title = name;
      toast("‘" + name + "’ 수업을 열었습니다.");
    }).catch(function () {
      toast("수업 링크가 잘렸거나 손상되어 열 수 없습니다. 링크 전체를 다시 복사해 주세요.");
      try { history.replaceState(null, "", location.href.split("#")[0]); } catch (e) { /* 무시 */ }
    });
  }

  applyPrefs();
  renderAll();
  setPresent(false);
  if (LINKS_OK) openFromHash();
})();
</script>
</body>
